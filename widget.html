<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DDL.MISSION — widget</title>
<style>
@font-face {
  font-family: 'Fusion Pixel';
  src: url('./fusion-pixel.otf') format('opentype');
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000; color: #e8e8e8;
  font-family: 'Fusion Pixel', monospace; font-size: 13px; line-height: 1.5;
  padding: 10px 12px 8px;
}
.head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-bottom: 6px; border-bottom: 1px solid #2c2c2c; margin-bottom: 4px;
}
.head .name { font-size: 13px; }
.head .name::before { content: '◐ '; }
.head .count { color: #8a8a8a; font-size: 11px; }
.head .count .od { background: #e8e8e8; color: #000; padding: 0 4px; }
@keyframes blink { 50% { opacity: 0; } }
.blink { animation: blink 1s steps(2) infinite; }

.row {
  display: flex; align-items: baseline; gap: 7px;
  padding: 5px 2px; border-bottom: 1px solid #1d1d1d;
}
.row:last-child { border-bottom: none; }
.row .mark { font-size: 10px; color: #8a8a8a; flex: none; min-width: 12px; text-align: center; }
.row .mark.hi { color: #e8e8e8; }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cd { flex: none; font-size: 12px; color: #e8e8e8; }
.row.urgent .cd { background: #e8e8e8; color: #000; padding: 0 4px; }
.row.overdue .t { color: #8a8a8a; }
.row.overdue .cd { background: #e8e8e8; color: #000; padding: 0 4px; }

.foot {
  margin-top: 4px; padding-top: 5px; border-top: 1px solid #1d1d1d;
  color: #555; font-size: 10px; display: flex; justify-content: space-between;
}
.empty { color: #8a8a8a; text-align: center; padding: 14px 0 10px; }
</style>
</head>
<body>
<div class="head">
  <span class="name">DDL.MISSION</span>
  <span class="count" id="count"></span>
</div>
<div id="rows"></div>
<div class="foot">
  <span id="done-count"></span>
  <span>管理 → 127.0.0.1:8791</span>
</div>

<script>
'use strict';
let tasks = null;

function fmt(due, now) {
  const diff = due - now, abs = Math.abs(diff);
  const d = Math.floor(abs / 86400e3);
  const p = n => String(n).padStart(2, '0');
  const h = p(Math.floor(abs % 86400e3 / 3600e3)), m = p(Math.floor(abs % 3600e3 / 60e3)), s = p(Math.floor(abs % 60e3 / 1e3));
  return (diff >= 0 ? 'T-' : 'T+') + (d > 0 ? `${d}d ${h}:${m}` : `${h}:${m}:${s}`);
}

let lastH = 0;
function reportHeight() {
  const h = document.documentElement.scrollHeight;
  if (h !== lastH) { lastH = h; try { parent.postMessage({ ddlMissionHeight: h }, '*'); } catch (e) {} }
}

function render() {
  const rowsEl = document.getElementById('rows');
  const countEl = document.getElementById('count');
  const now = Date.now();
  if (!tasks) {
    countEl.textContent = '';
    rowsEl.innerHTML = '<div class="empty">server offline</div>';
    document.getElementById('done-count').textContent = '';
    return reportHeight();
  }
  const active = tasks.filter(t => !t.done).sort((a, b) => a.due - b.due);
  const overdue = active.filter(t => t.due < now).length;
  countEl.innerHTML = `ACTIVE ${String(active.length).padStart(2, '0')}` +
    (overdue ? ` <span class="od blink">OVERDUE ${String(overdue).padStart(2, '0')}</span>` : '');
  document.getElementById('done-count').textContent =
    `DONE ${tasks.filter(t => t.done).length}/${tasks.length}`;
  if (!active.length) {
    rowsEl.innerHTML = '<div class="empty">全部清空 — 享受真空</div>';
    return reportHeight();
  }
  const marks = { '高': '▲', '中': '△', '低': '▽' };
  rowsEl.innerHTML = active.map(t => {
    const od = t.due < now, ur = !od && t.due - now < 86400e3;
    return `<div class="row${od ? ' overdue' : ur ? ' urgent' : ''}">
      <span class="mark${t.prio === '高' ? ' hi' : ''}">${marks[t.prio] || '△'}${t.repeat ? '↻' : ''}</span>
      <span class="t">${esc(t.title)}</span>
      <span class="cd${od ? ' blink' : ''}">${fmt(t.due, now)}</span>
    </div>`;
  }).join('');
  reportHeight();
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function poll() {
  try {
    const r = await fetch('http://127.0.0.1:8791/api/tasks', { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (Array.isArray(j)) tasks = j; }
  } catch (e) {}
}
poll();
setInterval(poll, 5000);
setInterval(render, 1000);
addEventListener('load', render);
</script>
</body>
</html>
