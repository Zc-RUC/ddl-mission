<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DDL.MISSION — widget</title>
<style>
@font-face {
  font-family: 'Fusion Pixel';
  src: url('./fusion-pixel.otf') format('opentype');
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #000; --fg: #e8e8e8; --dim: #8a8a8a; --faint: #3a3a3a; --line: #2c2c2c;
  --panel: #000; --accent: #e8e8e8; --radius: 0px;
  --font: 'Fusion Pixel', monospace;
}
body[data-theme="linear"] {
  --bg: #08090a; --fg: #f7f8f8; --dim: #8a8f98; --faint: #3f4145; --line: rgba(255,255,255,.09);
  --panel: #0f1011; --accent: #5e6ad2; --radius: 9px;
  --font: "SF Pro Display", -apple-system, "Segoe UI", sans-serif;
}
body[data-theme="anthropic"] {
  --bg: #faf9f5; --fg: #141413; --dim: #6b6a5f; --faint: #c9c6b8; --line: #e8e6dc;
  --panel: #f5f4ed; --accent: #d97757; --radius: 6px;
  --font: "SF Pro Text", -apple-system, "Segoe UI", sans-serif;
}
body[data-theme="vercel"] {
  --bg: #fafafa; --fg: #171717; --dim: #666; --faint: #d4d4d4; --line: #ebebeb;
  --panel: #fff; --accent: #171717; --radius: 6px;
  --font: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
}
body {
  background: var(--panel); color: var(--fg);
  font-family: var(--font); font-size: 13px; line-height: 1.5;
  padding: 10px 12px 8px;
}
.head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
}
.head .name { font-size: 13px; }
.head .name::before { content: '◐ '; }
.head .count { color: var(--dim); font-size: 11px; }
.head .count .od { background: var(--accent); color: var(--bg); padding: 0 4px; }
@keyframes blink { 50% { opacity: 0; } }
.blink { animation: blink 1s steps(2) infinite; }

.row {
  display: flex; align-items: baseline; gap: 7px;
  padding: 5px 2px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: none; }
.row .mark { font-size: 10px; color: var(--dim); flex: none; min-width: 12px; text-align: center; }
.row .mark.hi { color: var(--fg); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cd { flex: none; font-size: 12px; color: var(--fg); }
.row.urgent .cd { background: var(--accent); color: var(--bg); padding: 0 4px; }
.row.overdue .t { color: var(--dim); }
.row.overdue .cd { background: var(--accent); color: var(--bg); padding: 0 4px; }

.foot {
  margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--line);
  color: var(--dim); font-size: 10px; display: flex; justify-content: space-between; opacity: .7;
}
.empty { color: var(--dim); text-align: center; padding: 14px 0 10px; }
#theme-btn { cursor: pointer; }
#theme-btn:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="head">
  <span class="name">DDL.MISSION</span>
  <span class="count" id="count"></span>
</div>
<div id="rows"></div>
<div class="foot">
  <span id="done-count"></span>
  <span><span id="theme-btn" title="点击切换皮肤">皮肤:像素</span> · 管理 → 127.0.0.1:8791</span>
</div>

<script>
'use strict';
let tasks = null;

const THEME_NAMES = { mission: '像素', linear: '工程', anthropic: '奶油', vercel: '极简' };
const THEME_ORDER = ['mission', 'linear', 'anthropic', 'vercel'];
function currentTheme() { try { return localStorage.getItem('ddl-theme') || 'mission'; } catch (e) { return 'mission'; } }
function updateThemeBtn() { document.getElementById('theme-btn').textContent = '皮肤:' + THEME_NAMES[currentTheme()]; }

function applyTheme(push) {
  const t = currentTheme();
  if (document.body.dataset.theme !== t) document.body.dataset.theme = t;
  updateThemeBtn();
  if (push) {
    fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ theme: t }) }).catch(() => {});
  }
}
applyTheme(false);
document.getElementById('theme-btn').addEventListener('click', () => {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];
  try { localStorage.setItem('ddl-theme', next); } catch (e) {}
  applyTheme(true);
});

function fmt(due, now) {
  const diff = due - now, abs = Math.abs(diff);
  const d = Math.floor(abs / 86400e3);
  const p = n => String(n).padStart(2, '0');
  const h = p(Math.floor(abs % 86400e3 / 3600e3)), m = p(Math.floor(abs % 3600e3 / 60e3)), s = p(Math.floor(abs % 60e3 / 1e3));
  return (diff >= 0 ? 'T-' : 'T+') + (d > 0 ? `${d}d ${h}:${m}` : `${h}:${m}:${s}`);
}

let lastH = 0;
function reportHeight() {
  const h = document.documentElement.scrollHeight;
  if (h !== lastH) { lastH = h; try { parent.postMessage({ ddlMissionHeight: h }, '*'); } catch (e) {} }
}

function render() {
  const rowsEl = document.getElementById('rows');
  const countEl = document.getElementById('count');
  const now = Date.now();
  if (!tasks) {
    countEl.textContent = '';
    rowsEl.innerHTML = '<div class="empty">server offline</div>';
    document.getElementById('done-count').textContent = '';
    return reportHeight();
  }
  const active = tasks.filter(t => !t.done).sort((a, b) => a.due - b.due);
  const overdue = active.filter(t => t.due < now).length;
  countEl.innerHTML = `ACTIVE ${String(active.length).padStart(2, '0')}` +
    (overdue ? ` <span class="od blink">OVERDUE ${String(overdue).padStart(2, '0')}</span>` : '');
  document.getElementById('done-count').textContent =
    `DONE ${tasks.filter(t => t.done).length}/${tasks.length}`;
  if (!active.length) {
    rowsEl.innerHTML = '<div class="empty">全部清空 — 享受真空</div>';
    return reportHeight();
  }
  const marks = { '高': '▲', '中': '△', '低': '▽' };
  rowsEl.innerHTML = active.map(t => {
    const od = t.due < now, ur = !od && t.due - now < 86400e3;
    return `<div class="row${od ? ' overdue' : ur ? ' urgent' : ''}">
      <span class="mark${t.prio === '高' ? ' hi' : ''}">${marks[t.prio] || '△'}${t.repeat ? '↻' : ''}</span>
      <span class="t">${esc(t.title)}</span>
      <span class="cd${od ? ' blink' : ''}">${fmt(t.due, now)}</span>
    </div>`;
  }).join('');
  reportHeight();
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function poll() {
  applyTheme(false);
  try {
    const r = await fetch('/api/tasks', { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (Array.isArray(j)) tasks = j; }
  } catch (e) {}
  try {
    const rs = await fetch('/api/settings', { cache: 'no-store' });
    if (rs.ok) {
      const s = await rs.json();
      if (s && s.theme && s.theme !== currentTheme()) {
        try { localStorage.setItem('ddl-theme', s.theme); } catch (e) {}
        applyTheme(false);
      }
    }
  } catch (e) {}
}
poll();
setInterval(poll, 5000);
setInterval(render, 1000);
addEventListener('load', render);
</script>
</body>
</html>
